# ── Step 0: decide these once, before anything else ──────────────────────
# This file is the single source of truth. tools/new-work.sh reads it to
# stamp the licence header into every new work, so the header can never
# drift between one story and the next.
#
# Fill in every FILL_ME below, commit, and you never touch this file again
# (except to bump YEAR each January).

# Your name in Tamil script — appears in the Tamil licence header.
AUTHOR_TA="FILL_ME"

# Your name in Latin script — appears on archive.org, GitHub, and in the
# English licence line. Also used in archive.org identifiers.
AUTHOR_EN="FILL_ME"

# Latin-letters-and-hyphens slug of your name, for archive.org identifiers.
# Lowercase, no spaces, no dots. Example: balu-karthik
AUTHOR_SLUG="FILL_ME"

# Year stamped on new works.
YEAR="2026"

# Licence. CC BY 4.0 = others may copy, translate and reuse, and must
# credit you. Do not change this without changing LICENSE too.
LICENSE_NAME="Creative Commons Attribution 4.0 International (CC BY 4.0)"
LICENSE_URL="https://creativecommons.org/licenses/by/4.0/"

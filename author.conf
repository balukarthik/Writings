# ── Step 0: decide these once, before anything else ──────────────────────
# This file is the single source of truth. tools/new-work.sh reads it to
# stamp the licence header into every new work, so the header can never
# drift between one piece and the next.
#
# Fill in every FILL_ME below and commit.

# ── The author: my mother, who wrote these ───────────────────────────────
# Her name goes on the work, in the copyright line, and in archive.org's
# Creator field. Not the name of whoever types it up.
AUTHOR_TA="FILL_ME"          # her name in Tamil script
AUTHOR_EN="FILL_ME"          # her name in Latin script
AUTHOR_SLUG="FILL_ME"        # lowercase Latin + hyphens, for archive.org identifiers

# ── The custodian: me, doing the digitising ──────────────────────────────
# Recorded so it is clear who transcribed and uploaded, and so that credit
# for the writing is never confused with credit for the typing.
CUSTODIAN_TA="FILL_ME"
CUSTODIAN_EN="FILL_ME"

# ── Dates ────────────────────────────────────────────────────────────────
# Writing spans years, so each work carries its OWN year, passed as the
# third argument to new-work.sh. This is only the fallback when that is
# omitted. If a piece is undated, ask her, or estimate and say so.
DEFAULT_YEAR="2026"

# The year the digitising happened — stamped on every work.
DIGITIZED_YEAR="2026"

# ── Licence ──────────────────────────────────────────────────────────────
# CC BY 4.0 = others may copy, translate and reuse, and must credit her.
# The grant is HERS to make, not the custodian's — see README, "Whose
# permission this is". Record it here once given.
LICENSE_NAME="Creative Commons Attribution 4.0 International (CC BY 4.0)"
LICENSE_URL="https://creativecommons.org/licenses/by/4.0/"
LICENSE_GRANTED_BY="FILL_ME"   # the author's name, as the person who agreed
LICENSE_GRANTED_ON="FILL_ME"   # YYYY-MM-DD she agreed
